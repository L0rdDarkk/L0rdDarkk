<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360" font-family="'JetBrains Mono','Fira Code',ui-monospace,Consolas,monospace" role="img" aria-label="L0rdDarkk threat operations console">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1017"/>
      <stop offset="1" stop-color="#070b11"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f7a5"/>
      <stop offset="0.5" stop-color="#4fe3ff"/>
      <stop offset="1" stop-color="#00f7a5"/>
    </linearGradient>
    <radialGradient id="scopeGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0c2a24"/>
      <stop offset="1" stop-color="#070b11"/>
    </radialGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f7a5" stop-opacity="0"/>
      <stop offset="1" stop-color="#00f7a5" stop-opacity="0.55"/>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="1.1"/></filter>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0V26" fill="none" stroke="#17202b" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- frame -->
  <rect x="1" y="1" width="878" height="358" rx="14" fill="url(#panel)" stroke="#1b2a1f" stroke-width="1.5"/>
  <rect x="14" y="44" width="852" height="268" fill="url(#grid)" opacity="0.6"/>

  <!-- window chrome -->
  <g>
    <circle cx="28" cy="24" r="5.5" fill="#ff5f57"/>
    <circle cx="48" cy="24" r="5.5" fill="#febc2e"/>
    <circle cx="68" cy="24" r="5.5" fill="#28c840"/>
    <text x="92" y="29" fill="#4a5a6a" font-size="13">l0rddarkk@darknet: ~/ops — threat-console</text>
    <text x="780" y="29" fill="#28c840" font-size="12">LIVE</text>
    <rect id="liveblink" x="762" y="19" width="7" height="7" rx="3.5" fill="#28c840">
      <animate attributeName="opacity" values="1;0.15;1" dur="1.3s" repeatCount="indefinite"/>
    </rect>
  </g>
  <line x1="0" y1="42" x2="880" y2="42" stroke="#161f29"/>

  <!-- ===== RADAR SCOPE (left) ===== -->
  <g transform="translate(150,186)">
    <circle r="118" fill="url(#scopeGlow)" stroke="#12351f" stroke-width="1.5"/>
    <circle r="80" fill="none" stroke="#163a26" stroke-width="1"/>
    <circle r="42" fill="none" stroke="#163a26" stroke-width="1"/>
    <line x1="-118" y1="0" x2="118" y2="0" stroke="#163a26" stroke-width="1"/>
    <line x1="0" y1="-118" x2="0" y2="118" stroke="#163a26" stroke-width="1"/>
    <line x1="-83" y1="-83" x2="83" y2="83" stroke="#122e1e" stroke-width="1"/>
    <line x1="-83" y1="83" x2="83" y2="-83" stroke="#122e1e" stroke-width="1"/>

    <!-- rotating sweep -->
    <g>
      <path d="M0 0 L118 -26 A118 118 0 0 1 118 26 Z" fill="url(#sweep)"/>
      <line x1="0" y1="0" x2="118" y2="0" stroke="#00f7a5" stroke-width="1.5" stroke-opacity="0.9"/>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="3.6s" repeatCount="indefinite"/>
    </g>

    <!-- target blips -->
    <g fill="#00f7a5">
      <circle cx="54" cy="-38" r="3.2">
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.5;1" dur="3.6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="54" cy="-38" r="3.2" fill="none" stroke="#00f7a5">
        <animate attributeName="r" values="3;16" dur="3.6s" begin="0.1s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.9;0" dur="3.6s" begin="0.1s" repeatCount="indefinite"/>
      </circle>
    </g>
    <g fill="#ffb000">
      <circle cx="-62" cy="44" r="3.2">
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.3;0.42;0.75;1" dur="3.6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="-62" cy="44" r="3.2" fill="none" stroke="#ffb000">
        <animate attributeName="r" values="3;16" dur="3.6s" begin="1.4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.9;0" dur="3.6s" begin="1.4s" repeatCount="indefinite"/>
      </circle>
    </g>
    <g fill="#ff4d5e">
      <circle cx="30" cy="68" r="3.4">
        <animate attributeName="opacity" values="0;0;0;1;1;0" keyTimes="0;0.4;0.62;0.68;0.9;1" dur="3.6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="30" cy="68" r="3.4" fill="none" stroke="#ff4d5e">
        <animate attributeName="r" values="3;18" dur="3.6s" begin="2.3s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0" dur="3.6s" begin="2.3s" repeatCount="indefinite"/>
      </circle>
    </g>
    <text x="0" y="-98" text-anchor="middle" fill="#2f6b4f" font-size="10" letter-spacing="3">SURFACE SCAN</text>
  </g>

  <!-- ===== IDENTITY + LOG (right) ===== -->
  <g transform="translate(330,0)">
    <!-- glitch title -->
    <g>
      <text x="0" y="112" font-size="54" font-weight="700" fill="#ff2e63" opacity="0.5" filter="url(#soft)">
        L0rdDarkk
        <animate attributeName="x" values="0;3;-2;0;0" keyTimes="0;0.02;0.05;0.08;1" dur="4s" repeatCount="indefinite"/>
      </text>
      <text x="0" y="112" font-size="54" font-weight="700" fill="#17e0ff" opacity="0.5" filter="url(#soft)">
        L0rdDarkk
        <animate attributeName="x" values="0;-3;2;0;0" keyTimes="0;0.02;0.05;0.08;1" dur="4s" repeatCount="indefinite"/>
      </text>
      <text x="0" y="112" font-size="54" font-weight="700" fill="url(#title)">L0rdDarkk</text>
    </g>
    <text x="2" y="140" font-size="13.5" fill="#6b7f90" letter-spacing="3.5">CYBER SECURITY ENGINEER  //  RED TEAM</text>

    <!-- log feed -->
    <g font-size="13.5">
      <g opacity="0">
        <text x="0" y="186"><tspan fill="#28c840">[OK]</tspan><tspan fill="#8597a6" dx="8">recon.sh — subdomains mapped .......... 142</tspan></text>
        <animate attributeName="opacity" values="0;1;1" keyTimes="0;0.06;1" dur="6s" begin="0.2s" repeatCount="indefinite"/>
      </g>
      <g opacity="0">
        <text x="0" y="210"><tspan fill="#4fe3ff">[&gt;&gt;]</tspan><tspan fill="#8597a6" dx="8">fuzzing endpoints ......... 0days&gt;theory</tspan></text>
        <animate attributeName="opacity" values="0;1;1" keyTimes="0;0.06;1" dur="6s" begin="1.4s" repeatCount="indefinite"/>
      </g>
      <g opacity="0">
        <text x="0" y="234"><tspan fill="#ffb000">[!!]</tspan><tspan fill="#8597a6" dx="8">vuln confirmed — severity: </tspan><tspan fill="#ff4d5e">CRITICAL</tspan></text>
        <animate attributeName="opacity" values="0;1;1" keyTimes="0;0.06;1" dur="6s" begin="2.6s" repeatCount="indefinite"/>
      </g>
      <g opacity="0">
        <text x="0" y="258"><tspan fill="#00f7a5">[++]</tspan><tspan fill="#8597a6" dx="8">foothold established .......... </tspan><tspan fill="#00f7a5">root@box</tspan></text>
        <animate attributeName="opacity" values="0;1;1" keyTimes="0;0.06;1" dur="6s" begin="3.8s" repeatCount="indefinite"/>
      </g>
      <g>
        <text x="0" y="282"><tspan fill="#6b7f90">darknet:~$</tspan></text>
        <rect x="88" y="271" width="9" height="15" fill="#00f7a5">
          <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
        </rect>
      </g>
    </g>
  </g>

  <!-- ===== status bar ===== -->
  <line x1="0" y1="320" x2="880" y2="320" stroke="#161f29"/>
  <g font-size="11.5" letter-spacing="1" transform="translate(24,340)">
    <circle cx="0" cy="-4" r="4" fill="#00f7a5"><animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite"/></circle>
    <text x="12" y="0" fill="#6b7f90">SIEM</text>
    <circle cx="96" cy="-4" r="4" fill="#4fe3ff"><animate attributeName="opacity" values="1;0.3;1" dur="2.1s" repeatCount="indefinite"/></circle>
    <text x="108" y="0" fill="#6b7f90">DETECTION</text>
    <circle cx="232" cy="-4" r="4" fill="#ffb000"><animate attributeName="opacity" values="1;0.3;1" dur="1.6s" repeatCount="indefinite"/></circle>
    <text x="244" y="0" fill="#6b7f90">RED-TEAM</text>
    <circle cx="360" cy="-4" r="4" fill="#ff4d5e"><animate attributeName="opacity" values="1;0.3;1" dur="2.4s" repeatCount="indefinite"/></circle>
    <text x="372" y="0" fill="#6b7f90">AI-SEC</text>
    <text x="820" y="0" fill="#2f4150" text-anchor="end">uptime: always_learning</text>
  </g>
</svg>
