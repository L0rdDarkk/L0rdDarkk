name: Update telemetry stats

# Regenerates assets/telemetry.svg from live GitHub data.
on:
  schedule:
    - cron: "17 3 * * *"      # every day at 03:17 UTC
  workflow_dispatch:           # lets you run it on demand from the Actions tab
  push:
    branches: [main, master]
    paths:
      - ".github/scripts/generate_stats.py"
      - ".github/workflows/update-stats.yml"

permissions:
  contents: write              # allows the job to commit the refreshed SVG

concurrency:
  group: update-stats
  cancel-in-progress: true

jobs:
  telemetry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate telemetry.svg
        env:
          # Prefer a personal access token (includes private contributions);
          # falls back to the built-in token for public-only data.
          GH_TOKEN: ${{ secrets.GH_STATS_TOKEN || secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: python .github/scripts/generate_stats.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- assets/stats-card.svg assets/contrib-heatmap.svg; then
            echo "No changes to stats-card.svg / contrib-heatmap.svg"
          else
            git add assets/stats-card.svg assets/contrib-heatmap.svg
            git commit -m "chore: refresh stats + contribution heatmap [skip ci]"
            git push
          fi
